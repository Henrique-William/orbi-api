jwt.public.key=${JWT_PUBLIC_KEY_PATH:classpath:app.pub}
jwt.private.key=${JWT_PRIVATE_KEY_PATH:classpath:app.key}

admin.password=${ADMIN_PASS:test-admin-pass}

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.datasource.url=jdbc:h2:mem:orbi_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.show-sql=false

ors.base-url=https://api.heigit.org/openrouteservice
ors.api-key=${ORS_API_KEY:test-ors-api-key}
orbi.route.surface-weight-enabled=true
